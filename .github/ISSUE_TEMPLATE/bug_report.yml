name: Bug report
description: The game or the launcher does something wrong, crashes or does not start.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before you start, the README's [Getting started](https://github.com/johnnygentoo/gvport#getting-started) covers preparing the game.

        Only your own dump of GUNDAM VERSUS (CUSA08790) with the 1.13 update is supported. Do not ask for, link or attach game files or saves ([LEGAL.md](https://github.com/johnnygentoo/gvport/blob/HEAD/LEGAL.md)).
  - type: input
    id: version
    attributes:
      label: Version
      description: The launcher's **About** page shows it.
      placeholder: "0.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - AppImage
        - From source (run.sh / the launcher in a checkout)
        - Steam Deck (AppImage)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, GPU and driver
      placeholder: CachyOS, RTX 3060, NVIDIA 580.95 / Fedora 43, RX 7800 XT, Mesa 25.2
    validations:
      required: true
  - type: input
    id: graphics
    attributes:
      label: Upscaler, preset and output resolution
      description: From the launcher's **Settings** page or the in-game menu (Insert / L3+R3).
      placeholder: FSR 3.1, Quality, 2560x1440
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots or a short video help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Where in the game, and what you did right before. Say if it happens every time.
      placeholder: |
        1. Free Battle, 2 vs 2, any stage
        2. Fire a beam rifle at the start of the battle
        3. The game freezes for a second
  - type: dropdown
    id: online
    attributes:
      label: Online
      options:
        - Offline
        - Two players on one PC
        - Over the network, through gvnet-server
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        In the launcher's **Log** page, **Export log…** and drag the file here (or **Copy** and paste it).
        Do not paste your trophy key anywhere in the issue.
      placeholder: Drag the exported log here.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use my own dump of GUNDAM VERSUS with the 1.13 update.
          required: true
        - label: I searched the existing issues for the same problem.
          required: true
